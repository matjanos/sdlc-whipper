<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whipper — process board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='6' width='12' height='4' fill='%2334D97B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0A; --panel:#101210; --ink:#E9EDE7; --dim:#8A9186; --faint:#565C54;
    --line:rgba(233,237,231,.14); --soft:rgba(233,237,231,.06);
    --green:#34D97B; --amber:#E8B341; --red:#E5564E;
    --label:"Archivo",sans-serif; --mono:"Spline Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12.5px;line-height:1.55;
    font-variant-numeric:tabular-nums}
  ::selection{background:rgba(52,217,123,.25)}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
  a:hover{text-decoration-color:var(--ink)}
  button{font-family:var(--mono)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 48px}

  /* ── header ─────────────────────────────────────────────── */
  header{display:flex;align-items:center;gap:14px;padding:18px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .mark{font-family:var(--label);font-weight:650;font-stretch:118%;font-size:15px;letter-spacing:.02em}
  .mark small{display:block;font-weight:500;font-stretch:100%;font-size:8.5px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;margin-top:1px}
  .hmeta{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .hmeta b{color:var(--ink);font-weight:500}
  .hright{margin-left:auto;display:flex;align-items:center;gap:14px}
  .beacon{display:flex;align-items:center;gap:6px;font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .beacon i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .beacon.live i{background:var(--green);animation:pulse 2.2s ease-in-out infinite}
  .beacon.warn i{background:var(--amber)} .beacon.down i{background:var(--red)}
  @keyframes pulse{50%{opacity:.35}}
  #clock{font-size:11px;color:var(--dim);letter-spacing:.08em}

  .degrade{display:none;margin-top:10px;padding:7px 12px;border:1px solid var(--amber);
    font-size:10px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
  .degrade.on{display:block}
  .degrade b{color:var(--ink);font-weight:500}

  /* ── process spine ──────────────────────────────────────── */
  .spine{margin-top:26px}
  .spine-cap{font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .spine-track{display:flex;border-top:1px solid var(--line)}
  .stage{flex:1;padding:10px 8px 0;border-top:2px solid transparent;margin-top:-1.5px;min-width:0}
  .stage .sn{font-family:var(--label);font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--faint);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage .sc{font-size:10px;color:var(--faint);margin-top:1px;min-height:15px}
  .stage.here{border-top-color:var(--amber)}
  .stage.here .sn{color:var(--ink)}
  .stage.here .sc{color:var(--amber)}
  .stage.past{border-top-color:var(--green)}
  .stage .sc b{color:var(--ink);font-weight:600}

  /* ── board ───────────────────────────────────────────────── */
  .cap{display:flex;align-items:baseline;gap:10px;margin:30px 0 0;padding-bottom:7px;border-bottom:1px solid var(--line);
    font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .cap em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--dim);text-transform:none}

  .row{border-bottom:1px solid var(--soft)}
  .rowhead{display:grid;grid-template-columns:minmax(90px,120px) minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;
    padding:14px 2px 12px;cursor:pointer}
  .rowhead:hover .rk{color:var(--green)}
  .rk{font-weight:600;font-size:13px;letter-spacing:.04em;transition:color .15s}
  .rt{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;align-items:center;gap:10px;justify-self:end}
  .pill{font-family:var(--label);font-size:8.5px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;
    padding:3px 8px 2px;border:1px solid var(--line);color:var(--dim)}
  .pill.run{color:var(--green);border-color:rgba(52,217,123,.45)}
  .pill.park{color:var(--amber);border-color:rgba(232,179,65,.45)}
  .pill.att{color:var(--red);border-color:rgba(229,86,78,.5)}
  .pill.fin{color:var(--faint)}
  .toggle{font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;background:none;border:1px solid var(--line);padding:4px 10px;cursor:pointer;transition:all .15s}
  .toggle:hover{color:var(--ink);border-color:var(--ink)}
  .toggle.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}

  .stepper{grid-column:1 / -1;display:flex;align-items:baseline;gap:0;padding-top:6px}
  .step{flex:1;position:relative;padding-top:9px}
  .step::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--soft)}
  .step:first-child::before{border-radius:0}
  .step.done::before{background:rgba(52,217,123,.4)}
  .step.cur::before{background:var(--amber);animation:pulse 1.8s ease-in-out infinite}
  .step .lb{font-family:var(--label);font-size:8px;font-weight:600;letter-spacing:.14em;color:var(--faint);
    text-transform:uppercase;padding-right:6px}
  .step.done .lb{color:var(--dim)}
  .step.cur .lb{color:var(--amber)}
  .step.opt .lb{font-style:normal;opacity:.55}
  .stepstat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:2px 2px 0}
  .stepstat .where{font-size:10px;color:var(--dim);letter-spacing:.06em}
  .stepstat .where b{color:var(--ink);font-weight:500}
  .stepstat .elapsed{font-size:10px;color:var(--amber);letter-spacing:.06em}
  .meter{display:flex;align-items:center;gap:8px;min-width:150px}
  .meter .bar{flex:1;height:3px;background:var(--soft);position:relative;max-width:110px}
  .meter .bar i{position:absolute;inset:0 auto 0 0;background:var(--green)}
  .meter .bar i.warn{background:var(--amber)} .meter .bar i.over{background:var(--red)}
  .meter .mv{font-size:9.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}

  /* ── drawer (drill-down) ─────────────────────────────────── */
  .drawer{display:none;border-top:1px solid var(--line);margin-top:10px}
  .drawer.open{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:0}
  .dsides{border-right:1px solid var(--soft);padding:12px 14px 14px 2px;display:flex;flex-direction:column;gap:14px}
  .ds{font-family:var(--label);font-size:8.5px;font-weight:600;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin-bottom:7px}
  .sess{border:1px solid var(--soft);padding:8px 10px;margin-bottom:6px;font-size:10.5px}
  .sess .sr{display:flex;align-items:center;gap:7px}
  .sess i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0}
  .sess.running i{background:var(--green);animation:pulse 1.6s ease-in-out infinite}
  .sess .srole{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
  .sess .smod{color:var(--faint);font-size:9.5px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .stok{color:var(--dim);font-size:9.5px;margin-top:1px;display:block}
  .stop{margin-left:auto;background:none;border:1px solid rgba(229,86,78,.45);color:var(--red);
    font-size:8px;letter-spacing:.18em;padding:2px 7px;cursor:pointer;text-transform:uppercase}
  .stop:hover{background:var(--red);color:var(--bg)}
  .dlinks{display:flex;flex-direction:column;gap:5px;font-size:10.5px}
  .approve{background:none;border:1px solid rgba(52,217,123,.45);color:var(--green);
    font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;text-align:left}
  .approve:hover{background:var(--green);color:var(--bg)}

  .dlog{max-height:380px;overflow-y:auto;padding:10px 2px 12px 16px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .ev{display:grid;grid-template-columns:58px 74px 1fr auto;gap:10px;padding:3.5px 0;font-size:10.5px;
    color:var(--dim);border-bottom:1px dotted rgba(233,237,231,.05)}
  .ev:last-child{border-bottom:none}
  .ev .tm{color:var(--faint)} .ev .ph{color:var(--ink);opacity:.65;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding-top:1px}
  .ev.warn .tx{color:var(--amber)} .ev.error .tx{color:var(--red)}
  .ev .tk{color:var(--faint);font-size:9.5px;white-space:nowrap}
  .dlog .empty{color:var(--faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 0}

  /* ── queue ───────────────────────────────────────────────── */
  .qrow{display:flex;gap:14px;padding:8px 2px;border-bottom:1px solid var(--soft);font-size:11.5px;align-items:baseline}
  .qrow:last-child{border-bottom:none}
  .qk{font-weight:600;letter-spacing:.04em;min-width:72px}
  .qtag{font-family:var(--label);font-size:8.5px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;min-width:86px}
  .qtag.ready{color:var(--green)} .qtag.blocked{color:var(--dim)} .qtag.human{color:var(--amber)}
  .qt{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qwhy{margin-left:auto;color:var(--faint);font-size:10px;white-space:nowrap}

  .plain{padding:14px 2px;color:var(--faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}

  footer{margin-top:34px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;
    font-size:9.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  footer .src{margin-left:auto}

  /* ── boot + toast ────────────────────────────────────────── */
  .boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
    transition:opacity .4s}
  .boot.gone{opacity:0;pointer-events:none}
  .bootbox{text-align:center}
  .bootword{font-family:var(--label);font-weight:650;font-stretch:118%;font-size:22px}
  .bootline{margin-top:10px;font-family:var(--label);font-size:9px;font-weight:600;letter-spacing:.3em;
    color:var(--faint);text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite}
  .toast{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--line);
    padding:9px 14px;font-size:10.5px;letter-spacing:.06em;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:820px){
    .drawer.open{grid-template-columns:1fr}
    .dsides{border-right:none;border-bottom:1px solid var(--soft);padding:10px 2px}
    .dlog{padding-left:2px}
    .spine-track{flex-wrap:wrap} .stage{flex:1 1 20%;margin-bottom:8px}
    .rmeta{grid-column:1/-1;justify-self:start}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">whipper<small>process board</small></div>
    <span class="hmeta" id="hProject">—</span>
    <span class="hmeta" id="hAdapters">—</span>
    <div class="hright">
      <span class="beacon" id="bFeed"><i></i><span id="bFeedT">connecting</span></span>
      <span class="beacon" id="bAgents"><i></i>agents</span>
      <span class="beacon" id="bDry" hidden><i></i>dry run</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>
  <div class="degrade" id="degrade">tracker data is stale — <b id="degradeMsg"></b> — retrying in background</div>

  <section class="spine" aria-label="process position">
    <div class="spine-cap">the process — where deliveries stand</div>
    <div class="spine-track" id="spine"></div>
  </section>

  <div class="cap">deliveries <em id="boardNote"></em></div>
  <section id="board" aria-label="delivery board"></section>

  <div class="cap">queue <em id="queueNote"></em></div>
  <section id="queue" aria-label="queue"></section>

  <footer>
    <span id="fCaps"></span>
    <span id="fTokens"></span>
    <span class="src" id="fSrc"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="boot" id="boot">
  <div class="bootbox">
    <div class="bootword">whipper</div>
    <div class="bootline" id="bootLine">connecting to the conductor</div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const PHASES = ["split","research","council","execute","review","publish","preview","test"];
const norm = p => p === "await-preview" ? "preview" : p;
let state = null, feed = "poll", booted = false;
const openRows = new Set();

/* ── clock ── */
setInterval(() => { $("clock").textContent = new Date().toTimeString().slice(0,8); }, 1000);

/* ── boot ── */
function bootMsg(t, err){ if(!booted && $("bootLine")){ $("bootLine").textContent = t; $("boot").classList.toggle("gone", !!err ? false : false); } }
function bootDone(){ if(booted) return; booted = true; const b = $("boot"); b.classList.add("gone"); setTimeout(() => b.remove(), 500); }

/* ── feed ── */
let lastPayload = "";
function render(s){
  const j = JSON.stringify(s);
  if(j === lastPayload){ bootDone(); return; }   // identical snapshot — keep DOM (and focus, scroll) stable
  lastPayload = j;
  state = s; try{
    renderHeader(s); renderSpine(s); renderBoard(s); renderQueue(s); renderFooter(s);
  }catch(e){ console.error(e); } bootDone();
}
async function poll(){
  try{ const r = await fetch("/api/state"); if(r.ok) render(await r.json()); }
  catch{ if(!booted) $("bootLine").textContent = "cannot reach the conductor — retrying"; }
}
if(typeof EventSource !== "undefined"){
  const es = new EventSource("/api/events");
  es.addEventListener("state", e => { feed = "live"; render(JSON.parse(e.data)); });
  es.onerror = () => { feed = "poll"; };
}
setInterval(poll, 5000); poll();
setInterval(tickElapsed, 1000);

/* ── header ── */
function renderHeader(s){
  $("hProject").innerHTML = `team <b>${s.project.team}</b> · ${s.project.repoRoot.split("/").pop()}`;
  $("hAdapters").textContent = s.project.adapters;
  $("bFeed").className = "beacon " + (feed === "live" ? "live" : "warn");
  $("bFeedT").textContent = feed === "live" ? "live" : "polling";
  $("bAgents").className = "beacon " + (s.live.serviceUp ? (s.live.sessions.some(x=>x.running) ? "live" : "warn") : "down");
  $("bDry").hidden = !s.project.dryRun;
  $("degrade").classList.toggle("on", !!s.degraded);
  $("degradeMsg").textContent = s.degraded ?? "";
}

/* ── process spine: runs per stage ── */
function renderSpine(s){
  const here = new Map();
  for(const r of s.runs){
    if(!["inflight","parked","failed"].includes(r.status)) continue;
    const p = norm(r.phaseReached);
    if(p === "tick") continue;
    here.set(p, (here.get(p) ?? 0) + 1);
  }
  const doneCount = s.counts.done ?? 0;
  $("spine").innerHTML = PHASES.map((p, i) => {
    const n = here.get(p) ?? 0;
    const past = n === 0 && i < PHASES.indexOf(currentStage(s));
    const cls = n > 0 ? "here" : past ? "past" : "";
    return `<div class="stage ${cls}">
      <div class="sn">${p}</div>
      <div class="sc">${n > 0 ? `<b>${n}</b> ${n === 1 ? "run" : "runs"}` : past ? "cleared" : ""}</div>
    </div>`;
  }).join("");
  $("boardNote").textContent =
    `${s.counts.inProgress ?? 0} in progress · ${s.counts.readyNow ?? 0} ready · ${s.counts.blocked ?? 0} blocked · ${doneCount} done`;
}
function currentStage(s){
  const act = s.runs.filter(r => r.status === "inflight");
  if(!act.length) return "";
  return norm(act[0].phaseReached);
}

/* ── board ── */
const STATUS = {
  inflight:  ["running",  "run"],
  parked:    ["parked",   "park"],
  escalated: ["needs you","att"],
  failed:    ["failed",   "att"],
  delivered: ["done",     "fin"],
  "dry-run": ["dry run",  "fin"],
};
const ORDER = { inflight:0, parked:1, escalated:1, failed:1, "dry-run":2, delivered:3 };
function renderBoard(s){
  const board = $("board");
  const rows = [...s.runs].sort((a,b) =>
    (ORDER[a.status] ?? 4) - (ORDER[b.status] ?? 4) || (b.updatedAt ?? "").localeCompare(a.updatedAt ?? ""));
  if(!rows.length){ board.innerHTML = `<div class="plain">no deliveries yet — run “sdlc tick”</div>`; return; }
  const cap = s.project.budget.perTaskTokens;
  const tokensByTicket = new Map(s.budget.byTicket.map(r => [r.key, r.tokens]));
  const sessByTicket = new Map();
  for(const x of s.live.sessions){ const a = sessByTicket.get(x.ticket) ?? []; a.push(x); sessByTicket.set(x.ticket, a); }

  board.innerHTML = rows.map(r => {
    const cur = norm(r.phaseReached);
    const curIdx = PHASES.indexOf(cur);
    const [label, pill] = STATUS[r.status] ?? [r.status, "fin"];
    const steps = PHASES.map((p, i) => {
      const cls = i < curIdx ? "done" : i === curIdx ? "cur" : (p === "council" ? "opt" : "");
      return `<div class="step ${cls}"><span class="lb">${p}</span></div>`;
    }).join("");
    const phaseStart = phaseStartTs(s, r);
    const toks = tokensByTicket.get(r.ticket) ?? 0;
    const frac = Math.min(1, toks / cap);
    const mcls = toks > cap ? "over" : frac > 0.7 ? "warn" : "";
    const open = openRows.has(r.ticket);
    const pr = r.prNumber ? `<a href="${ghPrUrl(r.prNumber)}" target="_blank" rel="noreferrer">PR #${r.prNumber}</a>` : "";
    const pv = r.previewUrl ? `<a href="${r.previewUrl}" target="_blank" rel="noreferrer">preview</a>` : "";
    const appr = r.prNumber && r.status !== "delivered"
      ? `<button class="approve" data-pr="${r.prNumber}">Approve &amp; merge PR #${r.prNumber}</button>` : "";
    const sess = (sessByTicket.get(r.ticket) ?? []).slice(0, 6).map(a => `
      <div class="sess ${a.running ? "running" : ""}">
        <div class="sr"><i></i><span class="srole">${a.role}</span>
          ${a.running ? `<button class="stop" data-sid="${a.id}">stop</button>` : ""}</div>
        <span class="smod">${a.model ?? "model n/a"}</span>
        <span class="stok">${fmtTok(a.tokens.input)} in · ${fmtTok(a.tokens.output)} out</span>
      </div>`).join("") || `<div class="plain" style="padding:4px 0">no agent sessions</div>`;
    const evs = (s.events ?? []).filter(e => e.ticket === r.ticket).slice(-160);
    const evRows = evs.map(e => `<div class="ev ${e.level}">
      <span class="tm">${e.ts.slice(11,19)}</span><span class="ph">${e.phase ?? e.role ?? "run"}</span>
      <span class="tx">${esc(e.text)}</span><span class="tk">${e.tokens ? fmtTok(e.tokens)+" tok" : ""}</span>
    </div>`).join("") || `<div class="empty">no events recorded</div>`;
    return `<div class="row" data-key="${r.ticket}">
      <div class="rowhead" role="button" tabindex="0" aria-expanded="${open}" data-key="${r.ticket}">
        <span class="rk">${r.ticket}</span>
        <span class="rt">${esc(r.title ?? "")}</span>
        <span class="rmeta">
          <span class="pill ${pill}">${label}</span>
          <button class="toggle ${open ? "on" : ""}" data-log="${r.ticket}">log</button>
        </span>
        <div class="stepper">${steps}</div>
        <div class="stepstat">
          <span class="where">${curIdx >= 0 ? `stage <b>${curIdx+1}/${PHASES.length}</b> · ${cur}` : "queued"}</span>
          <span class="elapsed" data-since="${phaseStart}" data-running="${r.status === "inflight" ? 1 : 0}">${rel(phaseStart, r.status === "inflight")}</span>
          <span class="meter"><span class="bar"><i class="${mcls}" style="width:${Math.max(2, frac*100)}%"></i></span>
            <span class="mv">${fmtTok(toks)} / ${fmtTok(cap)}</span></span>
        </div>
      </div>
      <div class="drawer ${open ? "open" : ""}">
        <div class="dsides">
          <div><div class="ds">agents on this ticket</div>${sess}</div>
          <div><div class="ds">artifacts</div><div class="dlinks">${pr || pv ? pr+" "+pv : `<span style="color:var(--faint)">no PR yet</span>`}${appr}</div></div>
        </div>
        <div class="dlog" data-dlog="${r.ticket}">${evRows}</div>
      </div>
    </div>`;
  }).join("");

  for(const h of board.querySelectorAll(".rowhead")){
    h.addEventListener("click", e => {
      if(e.target.closest("button,a")) return;
      const k = h.dataset.key;
      openRows.has(k) ? openRows.delete(k) : openRows.add(k);
      renderBoard(state);
    });
    h.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); h.click(); } });
  }
  for(const b of board.querySelectorAll(".toggle"))
    b.addEventListener("click", () => { const k = b.dataset.log; openRows.has(k) ? openRows.delete(k) : openRows.add(k); renderBoard(state); });
  for(const b of board.querySelectorAll(".stop"))
    b.addEventListener("click", () => act({ type: "interrupt", sessionId: b.dataset.sid }, "agent stopped"));
  for(const b of board.querySelectorAll(".approve"))
    b.addEventListener("click", () => act({ type: "approve", pr: Number(b.dataset.pr) }, `approved PR #${b.dataset.pr}`));
  scrollDrawers(board);
}
function phaseStartTs(s, r){
  const cur = norm(r.phaseReached);
  const evs = (s.events ?? []).filter(e => e.ticket === r.ticket && (e.phase ?? "") === cur);
  return evs.length ? evs[evs.length-1].ts : (r.updatedAt ?? r.startedAt);
}
function scrollDrawers(board){
  for(const d of board.querySelectorAll(".dlog")){
    if(d.dataset.stick !== "y" && d.scrollTop + d.clientHeight < d.scrollHeight - 60) continue;
    d.dataset.stick = "y"; d.scrollTop = d.scrollHeight;
  }
}
function tickElapsed(){
  for(const el of document.querySelectorAll("[data-since]"))
    el.textContent = rel(el.dataset.since, el.dataset.running === "1");
}

/* ── queue ── */
function renderQueue(s){
  const q = $("queue");
  const rows = [];
  const onBoard = new Set(s.runs.map(r => r.ticket));
  for(const t of s.tickets){
    if(onBoard.has(t.key)) continue;               // already a board row — no duplication
    if(t.state === "done" || t.state === "cancelled") continue;
    if(t.needsInfo) rows.push([t.key, "needs you", t.title, "answer on the ticket"]);
    else if(t.blockedBy.length) rows.push([t.key, "blocked", t.title, `waiting for ${t.blockedBy.join(", ")}`]);
    else if(t.ready && t.selected) rows.push([t.key, "ready", t.title, "will dispatch on next tick"]);
  }
  $("queueNote").textContent = `${s.counts.readyNow ?? 0} ready · ${s.counts.blocked ?? 0} blocked`;
  q.innerHTML = rows.map(([k, tag, ti, why]) =>
    `<div class="qrow"><span class="qk">${k}</span><span class="qtag ${tag.replace(" ","")}">${tag}</span>
     <span class="qt">${esc(ti)}</span><span class="qwhy">${why}</span></div>`).join("")
    || `<div class="plain">queue is empty</div>`;
}

/* ── footer ── */
function renderFooter(s){
  $("fCaps").textContent = `caps: $${s.project.budget.perTaskUsd}/task · ${fmtTok(s.project.budget.perTaskTokens)} tokens/task · ${s.project.budget.maxParallelDeliveries} parallel`;
  $("fTokens").textContent = `ledger: ${fmtTok(s.budget.total.tokens)} tokens · $${s.budget.total.costUsd.toFixed(2)}`;
  $("fSrc").textContent = `source: /api/${feed === "live" ? "events (live)" : "state (poll 5s)"}`;
}

/* ── utils ── */
function fmtTok(n){ n = n ?? 0; return n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(0)+"k" : String(n); }
function rel(ts, running){
  if(!ts) return "";
  const d = Date.now() - new Date(ts).getTime();
  if(d < 0 || isNaN(d)) return "now";
  const m = Math.floor(d/60000), s = Math.floor((d%60000)/1000);
  const txt = m >= 60 ? `${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}m` : m >= 1 ? `${m}m${String(s).padStart(2,"0")}s` : `${s}s`;
  return running ? `${txt} in stage` : `${txt} ago`;
}
function ghPrUrl(n){ return `https://github.com/${ghSlug()}/pull/${n}`; }
function ghSlug(){ return "matjanos/sdlc-whipper"; }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ── actions ── */
async function act(body, okMsg){
  try{
    const r = await fetch("/api/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    toast(r.ok ? okMsg : (j.error ?? `error ${r.status}`));
    poll();
  }catch(e){ toast("action failed: " + e.message); }
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.className = "toast show";
  clearTimeout(toastTimer); setTimeout(() => t.className = "toast", 2600);
}
</script>
